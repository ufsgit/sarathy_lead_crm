<div *ngIf="issLoading" class="overlay" style="margin-top: 21%;margin-left:46% ;
background-color: transparent;" [style.left.px]="spinleft">
    <img src="/assets/img/spinner.gif" width="100px">
</div>

<div class="main-content new-margin-T">
    <div class="container-fluid2">
        <div class="row" *ngIf="Entry_View">
            <div class="col-md-12 pt-4">

                <div class="card-body">
                    <form>
                        <div class="row">
                            <div class="col-md-6 pl-2 pr-2">
                                <div class="form-group form-row">
                                    <label for="normal-input-4" class="col-md-2 col-sm-3 col-form-label text-sm-right"
                                        style="background: transparent;">Duration Count<span
                                            style="color:#ef071e; font-size: 22px; vertical-align: -webkit-baseline-middle;">*</span></label>
                                    <div class="col-md-10 col-sm-9">
                                        <input type="text" class="form-control" [(ngModel)]="Status_Duration_.Duration_Count"
                                            name="Status_Duration_.Duration_Count" id="normal-input-4"
                                            placeholder="Duration Count">
                                    </div>
                                </div>

                                <div class="form-row">
                                     <label class="col-md-1 col-sm-2 col-form-label text-sm-right">Channel<span style="
                                        color: #ef071e;
                                        font-size: 22px;
                                        vertical-align: -webkit-baseline-middle;
                                        ">*</span></label>
                                    <div class="col-md-5 col-sm-3 mb-1">
                                        <input type="text" [matAutocomplete]="auto1" class="form-control"
                                            name="FollowUp_Department_" [(ngModel)]="FollowUp_Department_"
                                            (mouseup)="Search_Default_Department_Typeahead($event, 2)"
                                            (input)="Search_Default_Department_Typeahead($event, 1)" />
                                    </div>

                                    <mat-autocomplete #auto1="matAutocomplete" [displayWith]="display_Department">
                                        <mat-option *ngIf="issLoading"><mat-spinner
                                                diameter="500"></mat-spinner></mat-option>
                                        <ng-container *ngIf="!issLoading">
                                            <mat-option *ngFor="let Dept of Followup_Department_Data_Check"
                                                [value]="Dept">
                                                <span>{{ Dept.Department_Name }}</span>
                                            </mat-option>
                                        </ng-container>
                                    </mat-autocomplete>

                                    <label class="col-md-1 col-sm-2 col-form-label text-sm-right">Channel Status<span style="
                                    color: #ef071e;
                                    font-size: 22px;
                                    vertical-align: -webkit-baseline-middle;
                                    ">*</span></label>
                                    <div class="col-md-5 col-sm-3 mb-1">
                                        <input type="text" class="form-control" [matAutocomplete]="auto8"
                                            name="Department_Status_" [(ngModel)]="Department_Status_"
                                          
                                            (input)="Search_Department_Status_Typeahead($event, 1)"
                                            (mouseup)="Search_Department_Status_Typeahead($event, 2)" placeholder=" " />
                                    </div>
                                    <mat-autocomplete #auto8="matAutocomplete" [displayWith]="display_Followup_Status">
                                        <mat-option *ngIf="issLoading"><mat-spinner
                                                diameter="500"></mat-spinner></mat-option>
                                        <ng-container *ngIf="!issLoading">
                                            <mat-option 
                                                *ngFor="let Status1 of Followup_Department_Status_Data_Filter" [value]="Status1">
                                                <span >{{
                                                    Status1.Department_Status_Name
                                                    }}</span></mat-option>
                                        </ng-container>
                                    </mat-autocomplete>

                                   
                                </div>

                                <div class="form-row mb-2">
                                    <div class="col-lg-12">
                                        <button mat-raised-button type="submit"
                                            class="close-button-style pull-right mr-1 "
                                            (click)="Close_Click()">Close</button>
                                        <button mat-raised-button type="submit" [hidden]="DSE_Save==false"
                                            id="Save_Button" class="save-button-style pull-right mr-1"
                                            (click)="Save_Status_Duration()">Save</button>

                                    </div>
                                </div>
                            </div>


                        </div>
                        <div class="clearfix"></div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <div class="row" *ngIf="!Entry_View">
        <div class="col-md-12  mb-2 mt-2">
            <div class="dt-card mb-0 pb-1 pt-3">
                <div class="dt-card__body mb-0 pb-0">
                    <form class="mb-0">
                        <div class="form-row" style="padding-left: 10px;">
                            <label class="col-md-0 col-sm-0 col-form-label text-sm-right">Duration Count</label>
                            <div class="col-md-2 col-sm-2 mb-2">
                                <input type="text" class="form-control" [(ngModel)]="Duration_Count_Search"
                                    name="Duration_Count_Search" placeholder="Duration Count">
                            </div>
                            <label class="col-md-0 col-sm-0 col-form-label text-sm-right">Channel</label>
                            <div class="col-md-2 col-sm-2 mb-2">
                                <select class="form-control p-0 pl-1" [(ngModel)]="Search_Depaertment_"
                                    name="Search_Depaertment_">
                                    <option *ngFor="let m of Department_Data" [ngValue]="m">
                                        {{ m.Department_Name }}
                                    </option>
                                </select>
                            </div>

                             <label class="col-md-0 col-sm-0 col-form-label text-sm-right">Chnnel Status</label>
                            <div class="col-md-2 col-sm-2 mb-2">
                                <select class="form-control p-0 pl-1" [(ngModel)]="Search_Department_Status_"
                                    name="Search_Department_Status_">
                                    <option *ngFor="let m of Department_Status_Data" [ngValue]="m">
                                        {{ m.Department_Status_Name }}
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-4 col-lg-3 mt-0">
                                <button (click)="Search_Status_Duration()" mat-raised-button type="submit"
                                    class="other-button-style pull-left mr-1">Search</button>
                                <button (click)="Create_New()" mat-raised-button type="submit"
                                    class="save-button-style pull-left mr-1 ">Create New</button>

                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

                <form>           
                <div class="form-row mb-0">
                    <div class="col-md-11 mt-2">

                                            <span class="user-name line-space">{{ Location1["Duration_Count"]
                                                }}</span> <span class="dt-separator-v">&nbsp;</span>
                                            <span class="user-name line-space">{{ Location1["Department_Status_Name"]
                                                }}</span> <span class="dt-separator-v">&nbsp;</span>
                                            <span class="user-name line-space">{{ Location1["Department_Name"] }}</span>

                                <!-- </div> -->

                            </div>
                        </div>

                        <button type="submit" (click)="Search_Client_Accounts()" class="btn btn-primary">Previous</button>
                        <button type="submit" (click)="Create_New()" class="btn btn-primary">Next</button>                             
                    </div> -->
                    </div>
                </div>

            </div>
        </div>
    </div>



</div>

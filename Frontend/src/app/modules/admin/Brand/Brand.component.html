        <div class="row" *ngIf="Entry_View">
            <div class="col-md-12 pt-4">

                <div class="card-body">
                    <form>

                                <div class="form-group form-row">
                                    <label for="normal-input-4" class="col-md-2 col-sm-3 col-form-label text-sm-right"
                                        style="background: transparent;">Brand Name<span
                                            style="color:#ef071e; font-size: 22px; vertical-align: -webkit-baseline-middle;">*</span></label>
                                    <div class="col-md-10 col-sm-9">
                                        <input type="text" class="form-control" [(ngModel)]="Brand_.Brand_Name"
                                            name="Brand_.Brand_Name" id="normal-input-4" placeholder="Brand Name">
                                    </div>
                                </div>






                                <div class="form-group form-row">
                                    <label for="normal-input-4" class="col-md-2 col-sm-3 col-form-label text-sm-right"
                                        style="background: transparent;">Default Channel<span
                                            style="color:#ef071e; font-size: 22px; vertical-align: -webkit-baseline-middle;">*</span></label>
                                    <div class="col-md-10 col-sm-9">
                                        <select [(ngModel)]="DefaultDepartment_Dropdown_"
                                            name="DefaultDepartment_Dropdown_" required class="form-control p-0 pl-1">
                                            <option
                                                *ngFor="let DefaultDepartment_Dropdown_DataT of DefaultDepartment_Dropdown_Data"
                                                [ngValue]="DefaultDepartment_Dropdown_DataT">
                                                {{DefaultDepartment_Dropdown_DataT.Department_Name}}</option>
                                        </select>
                                    </div>
                                </div>


                                <div class="form-row mb-2">
                                    <div class="col-lg-12">
                                        <button mat-raised-button type="submit"
                                            class="close-button-style pull-right mr-1 "
                                            (click)="Close_Click()">Close</button>
                                        <button mat-raised-button type="submit" [hidden]="Brand_Save==false"
                                            id="Save_Button" class="save-button-style pull-right mr-1"
                                            (click)="Save_Brand()">Save</button>

                                    </div>
                                </div>
                            </div>


                        </div>
                        <div class="clearfix"></div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <div class="row" *ngIf="!Entry_View">
        <div class="col-md-12  mb-2 mt-2">
            <div class="dt-card mb-0 pb-1 pt-3">
                <div class="dt-card__body mb-0 pb-0">
                    <form class="mb-0">
                        <div class="form-row" style="padding-left: 10px;">
                            <label class="col-md-0 col-sm-0 col-form-label text-sm-right">Brand Name</label>
                            <div class="col-md-3 col-sm-3 mb-2">
                                <input type="text" class="form-control" [(ngModel)]="Brand_Name_Search"
                                    name="Brand_Name" placeholder="Brand Name">

                            </div>

                            <label class="col-md-0 col-sm-0 col-form-label text-sm-right">Channel</label>
                            <div class="col-md-3 col-sm-3 mb-2">
                                <select class="form-control p-0 pl-1" [(ngModel)]="Channel_Search_Dropdown"
                                    name="Channel_Search_Dropdown">


                                    <option *ngFor="let channel of DefaultDepartment_Dropdown_Data" [ngValue]="channel">
                                        {{ channel.Department_Name }}
                                    </option>
                                </select>
                            </div>


                            <div class="col-md-4 col-lg-3 mt-0">
                                <button (click)="Search_Brand()" mat-raised-button type="submit"
                                    class="other-button-style pull-left mr-1">Search</button>
                                <button (click)="Create_New()" mat-raised-button type="submit"
                                    class="save-button-style pull-left mr-1 ">Create New</button>

                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

<div *ngIf="issLoading" class="overlay" style="margin-top: 21%;margin-left:46% ;
background-color: transparent;" [style.left.px]="spinleft">
    <img src="/assets/img/spinner.gif" width="100px">
</div>

<div class="main-content new-margin-T">
    <div class="container-fluid2">
        <div class="row" *ngIf="Entry_View">
            <div class="col-md-12 pt-4">

                <div class="card-body">
                    <form>
                        <div class="row">
                            <div class="col-md-6 pl-2 pr-2">

                                <div class="form-group form-row">
                                    <label for="normal-input-4" class="col-md-2 col-sm-3 col-form-label text-sm-right"
                                        style="background: transparent;">DSE Name<span
                                            style="color:#ef071e; font-size: 22px; vertical-align: -webkit-baseline-middle;">*</span></label>
                                    <div class="col-md-10 col-sm-9">
                                        <input type="text" class="form-control" [(ngModel)]="DSE_.DSE_Name"
                                            name="DSE_.DSE_Name" id="normal-input-4"
                                            placeholder="DSE Name">
                                    </div>
                                </div>

                                <div class="form-row">
                                    <label class="col-md-1 col-sm-2 col-form-label text-sm-right">Branch<span style="
                          color: #ef071e;
                          font-size: 22px;
                          vertical-align: -webkit-baseline-middle;
                        ">*</span></label>
                                    <div class="col-md-5 col-sm-3 mb-1">
                                        <input type="text" class="form-control" [matAutocomplete]="auto8"
                                            name="FollowUp_Branch_" [(ngModel)]="FollowUp_Branch_"
                                          
                                            (input)="Search_Branch_Typeahead($event, 1)"
                                            (mouseup)="Search_Branch_Typeahead($event, 2)" placeholder=" " />
                                    </div>
                                    <mat-autocomplete #auto8="matAutocomplete" [displayWith]="display_Branch">
                                        <mat-option *ngIf="issLoading"><mat-spinner
                                                diameter="500"></mat-spinner></mat-option>
                                        <ng-container *ngIf="!issLoading">
                                            <mat-option 
                                                *ngFor="let Branch1 of Followup_Branch_Data_Filter" [value]="Branch1">
                                                <span >{{
                                                    Branch1.Branch_Name
                                                    }}</span></mat-option>
                                        </ng-container>
                                    </mat-autocomplete>
                                    <label class="col-md-1 col-sm-2 col-form-label text-sm-right">Channel<span style="
                          color: #ef071e;
                          font-size: 22px;
                          vertical-align: -webkit-baseline-middle;
                        ">*</span></label>
                                    <div class="col-md-5 col-sm-3 mb-1">
                                        <input type="text" [matAutocomplete]="auto1" class="form-control"
                                            name="FollowUp_Department_" [(ngModel)]="FollowUp_Department_"
                                            (mouseup)="Search_Branch_Department_Typeahead($event, 2)"
                                            (input)="Search_Branch_Department_Typeahead($event, 1)" />
                                    </div>

                                    <mat-autocomplete #auto1="matAutocomplete" [displayWith]="display_Department">
                                        <mat-option *ngIf="issLoading"><mat-spinner
                                                diameter="500"></mat-spinner></mat-option>
                                        <ng-container *ngIf="!issLoading">
                                            <mat-option *ngFor="let Dept of Followup_Department_Data_Check"
                                                [value]="Dept">
                                                <span>{{ Dept.Department_Name }}</span>
                                            </mat-option>
                                        </ng-container>
                                    </mat-autocomplete>
                                </div>

                                <!-- 
                                <div class="form-group form-row">
                                    <label for="normal-input-4" class="col-md-2 col-sm-3 col-form-label text-sm-right"
                                        style="background: transparent;"> Branch<span
                                            style="color:#ef071e; font-size: 22px; vertical-align: -webkit-baseline-middle;">*</span></label>
                                    <div class="col-md-10 col-sm-9">
                                        <select [(ngModel)]="Model_Dropdown_" name="Model_Dropdown_" required
                                            class="form-control p-0 pl-1">
                                            <option *ngFor="let Model_Dropdown_DataT of Model_Dropdown_Data"
                                                [ngValue]="Model_Dropdown_DataT">
                                                {{Model_Dropdown_DataT.Country_Name}}</option>
                                        </select>
                                    </div>
                                </div> -->



                                <div class="form-row mb-2">
                                    <div class="col-lg-12">
                                        <button mat-raised-button type="submit"
                                            class="close-button-style pull-right mr-1 "
                                            (click)="Close_Click()">Close</button>
                                        <button mat-raised-button type="submit" [hidden]="DSE_Save==false"
                                            id="Save_Button" class="save-button-style pull-right mr-1"
                                            (click)="Save_DSE()">Save</button>

                                    </div>
                                </div>
                            </div>


                        </div>
                        <div class="clearfix"></div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <div class="row" *ngIf="!Entry_View">
        <div class="col-md-12  mb-2 mt-2">
            <div class="dt-card mb-0 pb-1 pt-3">
                <div class="dt-card__body mb-0 pb-0">
                    <form class="mb-0">
                        <div class="form-row" style="padding-left: 10px;">
                            <label class="col-md-0 col-sm-0 col-form-label text-sm-right">DSE Name</label>
                            <div class="col-md-3 col-sm-3 mb-2">
                                <input type="text" class="form-control" [(ngModel)]="DSE_Name_Search"
                                    name="DSE_Name_Search" placeholder="DSE Name">
                            </div>
                            <label class="col-md-0 col-sm-0 col-form-label text-sm-right">Branch</label>
                            <div class="col-md-2 col-sm-2 mb-2">
                                <select class="form-control p-0 pl-1" [(ngModel)]="Search_Barnch_"
                                    name="Search_Barnch_">
                                    <option *ngFor="let m of Branch_Data" [ngValue]="m">
                                        {{ m.Branch_Name }}
                                    </option>
                                </select>
                            </div>

                            <label class="col-md-0 col-sm-0 col-form-label text-sm-right">Channel</label>
                            <div class="col-md-3 col-sm-3 mb-2">
                                <select class="form-control p-0 pl-1" [(ngModel)]="Search_Department_"
                                    name="Search_Department_">
                                    <option *ngFor="let m11 of Department_Data" [ngValue]="m11">
                                        {{ m11.Department_Name }}
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-4 col-lg-3 mt-0">
                                <button (click)="Search_DSE()" mat-raised-button type="submit"
                                    class="other-button-style pull-left mr-1">Search</button>
                                <button (click)="Create_New()" mat-raised-button type="submit"
                                    class="save-button-style pull-left mr-1 ">Create New</button>

                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-12  pr-2 pl-2" [style.height.px]="myInnerHeight" itemSize="10">
            <div class="dt-module">
                <div class="dt-module__container">
                    <div class="dt-module__content ps-custom-scrollbar">
                        <div class="dt-module__content-inner card-body set-height-scroll-bar-wole-block">
                            <div class="dt-module__list" [style.height.px]="myInnerHeight" style="overflow-y: scroll"
                                id="profile">
                                <div class="dt-module__list-item pb-2 pt-2"
                                    *ngFor="let Location1 of DSE_Data; let i = index">
                                    <div class="dt-module__list-item-content">
                                        <div class="user-detail">

                                            <span class="icon-background2 mr-1" (click)="Edit_DSE(Location1,i)">
                                                <mat-icon class="text-green small">edit</mat-icon></span>
                                            <span class="icon-background3 mr-1" (click)="Delete_DSE(Location1,i)">
                                                <mat-icon class="text-red small">close</mat-icon></span>

                                            <span class="user-name line-space">{{ Location1["DSE_Name"]
                                                }}</span> <span class="dt-separator-v">&nbsp;</span>
                                            <span class="user-name line-space">{{ Location1["Branch_Name"]
                                                }}</span> <span class="dt-separator-v">&nbsp;</span>
                                            <span class="user-name line-space">{{ Location1["Department_Name"] }}</span>


                                        </div>

                                    </div>
                                </div>


                                <!-- </div> -->

                            </div>
                        </div>
                        <!-- <div class="form-group">                       
                        <button type="submit" (click)="Search_Client_Accounts()" class="btn btn-primary">Previous</button>
                        <button type="submit" (click)="Create_New()" class="btn btn-primary">Next</button>                             
                    </div> -->
                    </div>
                </div>

            </div>
        </div>
    </div>



</div>

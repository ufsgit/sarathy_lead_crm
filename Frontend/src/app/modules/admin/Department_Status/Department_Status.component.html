    <div class="row" *ngIf="!Entry_View">
      <div class="col-md-12 pl-0 pr-0 mb-2 mt-3">
        <div class="dt-card mb-0 pb-1 pt-3">
          <div class="dt-card__body mb-0 pb-0">
            <form class="mb-0">
              <div class="form-row" style="padding-left: 10px">
                <label class="col-md-0 col-sm-0 col-form-label text-sm-right">Channel Status</label>
                <div class="col-md-3 col-sm-3 mb-2">
                  <input type="text" class="form-control" [(ngModel)]="Department_Status_Name_Search"
                    name="Department_Status_Name" placeholder="Channel Status" />
                </div>

                <div class="col-md-4 col-lg-3 mt-0">
                  <button (click)="Search_Department_Status()" mat-raised-button type="submit"
                    class="other-button-style pull-left mr-1">
                    Search
                  </button>
                  <button (click)="Create_New_Department_Status()" mat-raised-button type="submit"
                    class="save-button-style pull-left mr-1">
                    Create New
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <!-- <div class="col-md-11 mt-2 mb-6">
          <button (click)="Create_New_Department_Status()" mat-raised-button type="submit" class="save-button-style pull-right ">Create New</button>
          <button (click)="Search_Department_Status()" mat-raised-button type="submit"  class="other-button-style pull-right mr-1">Search</button>
  
      </div> -->

      <div class="col-md-12 pl-0 pr-0" itemSize="10">
        <div class="dt-module">
          <div class="dt-module__container">
            <!-- style="overflow: scroll;"[style.height.px]="myTotalHeight" -->
            <div class="dt-module__content ps-custom-scrollbar">
              <div class="dt-module__content-inner card-bodyk">
                <!-- <div class="dt-module__list"  [style.height.px]="myInnerHeight " style="overflow-y: scroll"> -->
                <div class="dt-module__list" [style.height.px]="myInnerHeight" style="overflow-y: scroll" id="profile">
                  <!-- <div class="card-body set-height-scroll-bar-wole-block"> -->
                  <div class="dt-module__list-item pb-2 pt-2" *ngFor="
                      let Department_Status of Department_Status_Data;
                      let i = index
                    ">
                    <div class="dt-module__list-item-content">
                      <div class="user-detail">
                        <span class="icon-background2 mr-1" *ngIf="Department_Status_Edit"
                          (click)="Edit_Department_Status(Department_Status, i)">
                          <mat-icon class="text-green small">edit</mat-icon></span>
                        <span class="icon-background3 mr-1" *ngIf="Department_Status_Delete" (click)="
                            Delete_Department_Status(
                              Department_Status.Department_Status_Id,
                              i
                            )

  <div class="row" *ngIf="!Sub_Status_View">
    <div class="col-md-12 mt-2 pl-0">
      <div class="dt-card mb-0 pb-1">
        <div class="dt-card__body mt-1 mb-0 pb-0">
          <form class="mb-0">
            <div class="form-row">
              <label class="col-md-0 col-sm-0 col-form-label text-sm-right">Department Status</label>
              <div class="col-md-3 col-lg-3 col-xl-2 mb-2">
                <input readonly type="text" class="form-control" [(ngModel)]="Department_Status_.Department_Status_Name"
                  name="Department_Status_.Department_Status_Name" placeholder="" />
              </div>
              <label class="col-md-0 col-sm-0 col-form-label text-sm-right">Sub Status<span style="
                    color: #ef071e;
                    font-size: 22px;
                    vertical-align: -webkit-baseline-middle;
                  ">*</span></label>
              <div class="col-md-3 col-sm-3 col-xl-2 mb-2">
                <input type="text" class="form-control" [(ngModel)]="Sub_Status_.Sub_Status_Name"
                  name="Sub_Status_.Sub_Status_Name" placeholder="" />
              </div>

              <label for="normal-input-4" class="col-md-0 col-sm-0 col-form-label text-sm-right"
                style="background: transparent">FollowUp<span style="
                    color: #ef071e;
                    font-size: 22px;
                    vertical-align: -webkit-baseline-middle;
                  ">*</span></label>
              <div class="col-md-1 col-lg-2">
                <select name="FollowUp_Department" [(ngModel)]="Sub_Status_.FollowUp" required
                  class="form-control p-0 pl-1" id="normal-input-4">
                  <option value="1">yes</option>
                  <option value="0">No</option>
                </select>
              </div>

              <label for="normal-input-4" class="col-md-0 col-sm-0 col-form-label text-sm-right"
                style="background: transparent">Duration<span style="
                    color: #ef071e;
                    font-size: 22px;
                    vertical-align: -webkit-baseline-middle;
                  ">*</span></label>
              <div class="col-md-2 col-lg-1">
                <input type="number" class="form-control" [(ngModel)]="Sub_Status_.Duration" name="Sub_Status_.Duration"
                  id="normal-input-4" placeholder="" />
              </div>
              <div class="col-md-0 col-lg-0 col-xl-0">
                <button (click)="Close_Click()" mat-raised-button type="submit"
                  class="close-button-style pull-left btnflot mr-1">
                  Close
                </button>
                <button *ngIf="Department_Status_Save" (click)="Save_Sub_Status()"
                  [hidden]="Department_Status_Save == false" id="Save_Button" mat-raised-button type="submit"
                  class="save-button-style btnflot pull-left mr-1">
                  Save
                </button>
              </div>
            </div>
          </form>
        </div>
        <div class="dt-card__heading">
          <!-- <h4><b style="color: #3f6ad8;">District </b></h4> -->
        </div>
        <div class="col-md-12 pl-0 pr-0 mt-3" style="border: 1">
          <div class="container-import p-0 mr-0 ml-0">
            <div class="dt-card mb-0 pb-1" style="background-color: #ffff">
              <div class="table-responsive" [style.height.px]="myInnerHeight" style="
                  overflow: scroll;
                  height: 300px;
                  overflow-x: hidden !important;
                ">
                <table class="table table-hover colour-change-title-searchsection-table heading-styles-as-gmail-format">
                  <thead>
                    <th>Sub Status</th>
                    <th [hidden]="Department_Status_Edit == false">Edit</th>
                    <th [hidden]="Department_Status_Delete == false">Delete</th>
                    <th></th>
                  </thead>
                  <tbody *ngFor="
                      let Sub_Status_ of Department_Status_Data1;
                      let i = index
                    ">
                    <tr>
                      <td>{{ Sub_Status_["Sub_Status_Name"] }}</td>
                      <td>
                        <span class="icon-background2 mr-1" [hidden]="Department_Status_Edit == false"
                          *ngIf="Department_Status_Edit" (click)="Edit_Sub_Status(Sub_Status_, i)">
                          <mat-icon class="text-green small">edit</mat-icon></span>
                      </td>
                      <td class="td-padding">
                        <span class="icon-background3 mr-1" [hidden]="Department_Status_Delete == false"
                          *ngIf="Department_Status_Delete" (click)="
                            Delete_Sub_Status(Sub_Status_.Sub_Status_Id, i)
                          ">
                          <mat-icon class="text-red small">close</mat-icon></span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
